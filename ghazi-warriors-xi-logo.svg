<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="#1a1a2e" stroke="#c9a227" stroke-width="6"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#c9a227" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Shield Body -->
  <path d="M200 60 L310 110 L310 210 Q310 290 200 340 Q90 290 90 210 L90 110 Z"
        fill="#0f3460" stroke="#c9a227" stroke-width="4"/>

  <!-- Shield Inner Border -->
  <path d="M200 78 L295 122 L295 212 Q295 278 200 322 Q105 278 105 212 L105 122 Z"
        fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>

  <!-- Crossed Cricket Bats -->
  <g transform="translate(200,200) rotate(-35)">
    <rect x="-10" y="-90" width="20" height="110" rx="4" fill="#d4a843" stroke="#8B6914" stroke-width="1.5"/>
    <rect x="-6" y="-90" width="12" height="85" rx="3" fill="#e8c060"/>
    <rect x="-4" y="20" width="8" height="30" rx="2" fill="#c49a30"/>
  </g>
  <g transform="translate(200,200) rotate(35)">
    <rect x="-10" y="-90" width="20" height="110" rx="4" fill="#d4a843" stroke="#8B6914" stroke-width="1.5"/>
    <rect x="-6" y="-90" width="12" height="85" rx="3" fill="#e8c060"/>
    <rect x="-4" y="20" width="8" height="30" rx="2" fill="#c49a30"/>
  </g>

  <!-- Cricket Ball -->
  <circle cx="200" cy="195" r="28" fill="#c0392b" stroke="#8B0000" stroke-width="2"/>
  <circle cx="200" cy="195" r="28" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <path d="M178 185 Q200 175 222 185" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M178 205 Q200 215 222 205" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Stars -->
  <polygon points="200,130 203,140 213,140 205,146 208,156 200,150 192,156 195,146 187,140 197,140"
           fill="#c9a227" stroke="#a07820" stroke-width="0.5"/>
  <polygon points="148,195 150,201 156,201 151,205 153,211 148,207 143,211 145,205 140,201 146,201"
           fill="#c9a227" opacity="0.8"/>
  <polygon points="252,195 254,201 260,201 255,205 257,211 252,207 247,211 249,205 244,201 250,201"
           fill="#c9a227" opacity="0.8"/>

  <!-- Banner -->
  <path d="M100 285 Q200 270 300 285 L295 315 Q200 330 105 315 Z"
        fill="#c9a227" stroke="#8B6914" stroke-width="1.5"/>
  <text x="200" y="305" font-family="Georgia, serif" font-size="18" font-weight="bold"
        fill="#1a1a2e" text-anchor="middle" letter-spacing="1">GHAZI WARRIORS</text>

  <!-- XI Label -->
  <rect x="168" y="320" width="64" height="22" rx="4" fill="#0f3460" stroke="#c9a227" stroke-width="1.5"/>
  <text x="200" y="336" font-family="Georgia, serif" font-size="14" font-weight="bold"
        fill="#c9a227" text-anchor="middle" letter-spacing="3">XI</text>

  <!-- Top arc text -->
  <path id="topArc" d="M 80,200 A 120,120 0 0,1 320,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="13" fill="#c9a227" letter-spacing="2">
    <textPath href="#topArc" startOffset="15%">⚔ CRICKET CLUB ⚔</textPath>
  </text>
</svg>